[project]
name = "pap-analytics-mcp"
version = "0.1.7"
description = "Device-agnostic PAP (CPAP/APAP/ASV) therapy data analytics exposed to AI agents via MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "David Brazda" }]
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
]

[project.scripts]
pap = "pap_analytics.cli:main"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
