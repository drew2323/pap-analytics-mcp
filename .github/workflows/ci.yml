name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Fixture integrity
        run: for d in tests/data/*/; do (cd "$d" && sha256sum -c --quiet SHA256SUMS); done
